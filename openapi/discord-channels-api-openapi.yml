openapi: 3.1.0
info:
  title: Discord Interactions Application Commands Channels API
  description: The Discord Interactions API enables applications to create and respond to application commands (slash commands), message components, and modals. It supports both Gateway-based and webhook-based interaction handling, allowing bots to build rich, interactive user experiences within Discord.
  version: '10'
  contact:
    name: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
  termsOfService: https://discord.com/developers/docs/policies-and-agreements/developer-terms-of-service
servers:
- url: https://discord.com/api/v10
  description: Discord API v10
security:
- BotToken: []
tags:
- name: Channels
paths:
  /channels/{channel_id}/users/@me/threads/archived/private:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_my_private_archived_threads
      parameters:
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 100
      responses:
        '200':
          description: 200 response for list_my_private_archived_threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadsResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}/@me:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: emoji_name
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    put:
      operationId: add_my_message_reaction
      responses:
        '204':
          description: 204 response for add_my_message_reaction
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: delete_my_message_reaction
      responses:
        '204':
          description: 204 response for delete_my_message_reaction
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/threads/archived/private:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_private_archived_threads
      parameters:
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 100
      responses:
        '200':
          description: 200 response for list_private_archived_threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadsResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/threads/archived/public:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_public_archived_threads
      parameters:
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 2
          maximum: 100
      responses:
        '200':
          description: 200 response for list_public_archived_threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadsResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/thread-members/@me:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    put:
      operationId: join_thread
      responses:
        '204':
          description: 204 response for join_thread
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: leave_thread
      responses:
        '204':
          description: 204 response for leave_thread
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/bulk-delete:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: bulk_delete_messages
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/SnowflakeType'
                  minItems: 2
                  maxItems: 100
                  uniqueItems: true
              required:
              - messages
        required: true
      responses:
        '204':
          description: 204 response for bulk_delete_messages
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}/{user_id}:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: emoji_name
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    delete:
      operationId: delete_user_message_reaction
      responses:
        '204':
          description: 204 response for delete_user_message_reaction
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}/reactions/{emoji_name}:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: emoji_name
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    get:
      operationId: list_message_reactions_by_emoji
      parameters:
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 200 response for list_message_reactions_by_emoji
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: delete_all_message_reactions_by_emoji
      responses:
        '204':
          description: 204 response for delete_all_message_reactions_by_emoji
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}/reactions:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    delete:
      operationId: delete_all_message_reactions
      responses:
        '204':
          description: 204 response for delete_all_message_reactions
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}/crosspost:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: crosspost_message
      responses:
        '200':
          description: 200 response for crosspost_message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}/threads:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: create_thread_from_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextThreadWithMessageRequest'
        required: true
      responses:
        '201':
          description: 201 response for create_thread_from_message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/thread-members/{user_id}:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_thread_member
      parameters:
      - name: with_member
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: 200 response for get_thread_member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadMemberResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    put:
      operationId: add_thread_member
      responses:
        '204':
          description: 204 response for add_thread_member
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: delete_thread_member
      responses:
        '204':
          description: 204 response for delete_thread_member
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/thread-members:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_thread_members
      parameters:
      - name: with_member
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      responses:
        '200':
          description: 200 response for list_thread_members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreadMemberResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/permissions/{overwrite_id}:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: overwrite_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    put:
      operationId: set_channel_permission_overwrite
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/ChannelPermissionOverwrites'
                allow:
                  type:
                  - integer
                  - 'null'
                deny:
                  type:
                  - integer
                  - 'null'
        required: true
      responses:
        '204':
          description: 204 response for set_channel_permission_overwrite
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: delete_channel_permission_overwrite
      responses:
        '204':
          description: 204 response for delete_channel_permission_overwrite
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/recipients/{user_id}:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    put:
      operationId: add_group_dm_user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type:
                  - string
                  - 'null'
                  maxLength: 152133
                nick:
                  type:
                  - string
                  - 'null'
                  maxLength: 152133
        required: true
      responses:
        '201':
          description: 201 response for add_group_dm_user
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PrivateChannelResponse'
                - $ref: '#/components/schemas/PrivateGroupChannelResponse'
        '204':
          description: 204 response for add_group_dm_user
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: delete_group_dm_user
      responses:
        '204':
          description: 204 response for delete_group_dm_user
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/followers:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: follow_channel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_channel_id:
                  $ref: '#/components/schemas/SnowflakeType'
              required:
              - webhook_channel_id
        required: true
      responses:
        '200':
          description: 200 response for follow_channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelFollowerResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages/{message_id}:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_message
      responses:
        '200':
          description: 200 response for get_message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    delete:
      operationId: delete_message
      responses:
        '204':
          description: 204 response for delete_message
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    patch:
      operationId: update_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageEditRequestPartial'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageEditRequestPartial'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/MessageEditRequestPartial'
              - type: object
                properties:
                  files[0]:
                    type: string
                    contentEncoding: binary
                  files[1]:
                    type: string
                    contentEncoding: binary
                  files[2]:
                    type: string
                    contentEncoding: binary
                  files[3]:
                    type: string
                    contentEncoding: binary
                  files[4]:
                    type: string
                    contentEncoding: binary
                  files[5]:
                    type: string
                    contentEncoding: binary
                  files[6]:
                    type: string
                    contentEncoding: binary
                  files[7]:
                    type: string
                    contentEncoding: binary
                  files[8]:
                    type: string
                    contentEncoding: binary
                  files[9]:
                    type: string
                    contentEncoding: binary
        required: true
      responses:
        '200':
          description: 200 response for update_message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/messages:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_messages
      parameters:
      - name: around
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: 200 response for list_messages
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/MessageResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    post:
      operationId: create_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/components/schemas/MessageCreateRequest'
              - type: object
                properties:
                  files[0]:
                    type: string
                    contentEncoding: binary
                  files[1]:
                    type: string
                    contentEncoding: binary
                  files[2]:
                    type: string
                    contentEncoding: binary
                  files[3]:
                    type: string
                    contentEncoding: binary
                  files[4]:
                    type: string
                    contentEncoding: binary
                  files[5]:
                    type: string
                    contentEncoding: binary
                  files[6]:
                    type: string
                    contentEncoding: binary
                  files[7]:
                    type: string
                    contentEncoding: binary
                  files[8]:
                    type: string
                    contentEncoding: binary
                  files[9]:
                    type: string
                    contentEncoding: binary
        required: true
      responses:
        '200':
          description: 200 response for create_message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/webhooks:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_channel_webhooks
      responses:
        '200':
          description: 200 response for list_channel_webhooks
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  oneOf:
                  - $ref: '#/components/schemas/ApplicationIncomingWebhookResponse'
                  - $ref: '#/components/schemas/ChannelFollowerWebhookResponse'
                  - $ref: '#/components/schemas/GuildIncomingWebhookResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    post:
      operationId: create_webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                avatar:
                  type:
                  - string
                  - 'null'
                  contentEncoding: base64
              required:
              - name
        required: true
      responses:
        '200':
          description: 200 response for create_webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildIncomingWebhookResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/invites:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: list_channel_invites
      responses:
        '200':
          description: 200 response for list_channel_invites
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  anyOf:
                  - $ref: '#/components/schemas/FriendInviteResponse'
                  - $ref: '#/components/schemas/GroupDMInviteResponse'
                  - $ref: '#/components/schemas/GuildInviteResponse'
                  x-discord-union: oneOf
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
    post:
      operationId: create_channel_invite
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateGroupDMInviteRequest'
              - $ref: '#/components/schemas/CreateGuildInviteRequest'
              x-discord-union: oneOf
        required: true
      responses:
        '200':
          description: 200 response for create_channel_invite
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/FriendInviteResponse'
                - $ref: '#/components/schemas/GroupDMInviteResponse'
                - $ref: '#/components/schemas/GuildInviteResponse'
                x-discord-union: oneOf
        '204':
          description: 204 response for create_channel_invite
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Channels
  /channels/{channel_id}/threads:
    parameters:
    - name: channel_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: create_thread
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateForumThreadRequest'
              - $ref: '#/components/schemas/CreateTextThreadWithoutMessageRequest'
              x-discord-union: oneOf
          application/x-www-form-urlencoded:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateForumThreadRequest'
              - $ref: '#/components/schemas/CreateTextThreadWithoutMessageRequest'
              x-discord-union: oneOf
          multipart/form-data:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateForumThreadRequest'
              - $ref: '#/components/schemas/CreateTextThreadWithoutMessageRequest'
              x-discord-union: oneOf
        required: true
      responses:
        '201':
          description: 201 response for create_thread
          content:
