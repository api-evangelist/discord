openapi: 3.2.0
info:
  title: Discord HTTP API (Preview) Invites API
  description: Preview of the Discord v10 HTTP API specification. See https://discord.com/developers/docs for more details.
  termsOfService: https://discord.com/developers/docs/policies-and-agreements/developer-terms-of-service
  license:
    name: MIT
    identifier: MIT
  version: '10'
servers:
- url: https://discord.com/api/v10
tags:
- name: Invites
paths:
  /invites/{code}:
    parameters:
    - name: code
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    get:
      operationId: invite_resolve
      parameters:
      - name: with_counts
        in: query
        schema:
          type: boolean
      - name: guild_scheduled_event_id
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: target_channel_id
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: target_message_id
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      responses:
        '200':
          description: 200 response for invite_resolve
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FriendInviteResponse'
                - $ref: '#/components/schemas/GroupDMInviteResponse'
                - $ref: '#/components/schemas/GuildInviteResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - {}
      - BotToken: []
      tags:
      - Invites
      summary: Invite resolve
      x-summary-source: derived
    delete:
      operationId: invite_revoke
      responses:
        '200':
          description: 200 response for invite_revoke
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/FriendInviteResponse'
                - $ref: '#/components/schemas/GroupDMInviteResponse'
                - $ref: '#/components/schemas/GuildInviteResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Invite revoke
      x-summary-source: derived
  /invites/{code}/target-users:
    parameters:
    - name: code
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    get:
      description: Get the target users for an invite.
      operationId: get_invite_target_users
      responses:
        '200':
          description: 200 response for get_invite_target_users
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            text/csv:
              schema:
                type: string
                description: CSV file containing target users for the invite.
                contentEncoding: binary
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Get invite target users
      x-summary-source: derived
    put:
      description: Update the target users for an existing invite.
      operationId: update_invite_target_users
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                target_users_file:
                  type: string
                  contentEncoding: binary
              required:
              - target_users_file
        required: true
      responses:
        '204':
          description: 204 response for update_invite_target_users
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Update invite target users
      x-summary-source: derived
  /invites/{code}/target-users/bulk-add:
    parameters:
    - name: code
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    post:
      description: Add multiple target users to an existing invite.
      operationId: bulk_add_invite_target_users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  description: The IDs of the users to target.
                  items:
                    $ref: '#/components/schemas/SnowflakeType'
                  minItems: 1
                  maxItems: 1000
              required:
              - user_ids
        required: true
      responses:
        '204':
          description: 204 response for bulk_add_invite_target_users
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Bulk add invite target users
      x-summary-source: derived
  /invites/{code}/target-users/bulk-delete:
    parameters:
    - name: code
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    post:
      description: Remove multiple target users from an existing invite.
      operationId: bulk_remove_invite_target_users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  description: The IDs of the users to stop targeting.
                  items:
                    $ref: '#/components/schemas/SnowflakeType'
                  minItems: 1
                  maxItems: 1000
              required:
              - user_ids
        required: true
      responses:
        '204':
          description: 204 response for bulk_remove_invite_target_users
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Bulk remove invite target users
      x-summary-source: derived
  /invites/{code}/target-users/job-status:
    parameters:
    - name: code
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    get:
      description: Get the target users job status for an invite.
      operationId: get_invite_target_users_job_status
      responses:
        '200':
          description: 200 response for get_invite_target_users_job_status
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetUsersJobStatusResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Get invite target users job status
      x-summary-source: derived
  /invites/{code}/target-users/{user_id}:
    parameters:
    - name: code
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    put:
      description: Add a target user to an existing invite.
      operationId: add_invite_target_user
      responses:
        '204':
          description: 204 response for add_invite_target_user
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Add invite target user
      x-summary-source: derived
    delete:
      description: Remove a target user from an existing invite.
      operationId: remove_invite_target_user
      responses:
        '204':
          description: 204 response for remove_invite_target_user
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Invites
      summary: Remove invite target user
      x-summary-source: derived
components:
  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: The maximum number of requests that can be made in the current ratelimit window
    X-RateLimit-Bucket:
      schema:
        type: string
      description: The bucket that the request belongs to
    X-RateLimit-Reset:
      schema:
        type: number
      description: A unix timestamp in seconds at which the current ratelimit window resets
    X-RateLimit-Reset-After:
      schema:
        type: number
      description: The duration in seconds until the current ratelimit window resets
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: The number of requests remaining in the current ratelimit window
  schemas:
    GuildScheduledEventStatuses:
      type: integer
      oneOf:
      - title: SCHEDULED
        const: 1
      - title: ACTIVE
        const: 2
      - title: COMPLETED
        const: 3
      - title: CANCELED
        const: 4
      format: int32
    GuildNSFWContentLevel:
      type: integer
      oneOf:
      - title: DEFAULT
        const: 0
      - title: EXPLICIT
        const: 1
      - title: SAFE
        const: 2
      - title: AGE_RESTRICTED
        const: 3
      format: int32
    InviteGuildResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
        name:
          type: string
        splash:
          type:
          - string
          - 'null'
        banner:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        features:
          type: array
          items:
            $ref: '#/components/schemas/GuildFeatures'
          uniqueItems: true
        verification_level:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VerificationLevels'
        vanity_url_code:
          type:
          - string
          - 'null'
        nsfw_level:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GuildNSFWContentLevel'
        nsfw:
          type:
          - boolean
          - 'null'
        premium_subscription_count:
          type: integer
          format: int32
      required:
      - id
      - name
      - splash
      - banner
      - description
      - icon
      - features
      - verification_level
      - vanity_url_code
      - nsfw_level
      - nsfw
      - premium_subscription_count
    GroupDMInviteResponse:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 1
          allOf:
          - $ref: '#/components/schemas/InviteTypes'
          format: int32
        code:
          type: string
        inviter:
          $ref: '#/components/schemas/UserResponse'
        max_age:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        channel:
          $ref: '#/components/schemas/InviteChannelResponse'
        approximate_member_count:
          type:
          - integer
          - 'null'
          format: int32
      required:
      - type
      - code
      - expires_at
      - channel
    RecurrenceRuleFrequencies:
      type: integer
      oneOf:
      - title: DAILY
        const: 3
      - title: WEEKLY
        const: 2
      - title: MONTHLY
        const: 1
      - title: YEARLY
        const: 0
      format: int32
    GuildScheduledEventPrivacyLevels:
      type: integer
      oneOf:
      - title: GUILD_ONLY
        description: the scheduled event is only accessible to guild members
        const: 2
      format: int32
    GuildScheduledEventExceptionResponse:
      type: object
      properties:
        event_id:
          $ref: '#/components/schemas/SnowflakeType'
          description: ID of the scheduled event this exception belongs to
        event_exception_id:
          $ref: '#/components/schemas/SnowflakeType'
          description: ID of the event exception
        scheduled_start_time:
          type:
          - string
          - 'null'
          description: Overridden start time of this occurrence
          format: date-time
        scheduled_end_time:
          type:
          - string
          - 'null'
          description: Overridden end time of this occurrence
          format: date-time
        is_canceled:
          type: boolean
          description: Whether this occurrence is canceled
      required:
      - event_id
      - event_exception_id
      - scheduled_start_time
      - scheduled_end_time
      - is_canceled
    GuildRoleColorsResponse:
      type: object
      properties:
        primary_color:
          type: integer
          format: int32
        secondary_color:
          type:
          - integer
          - 'null'
          format: int32
        tertiary_color:
          type:
          - integer
          - 'null'
          format: int32
      required:
      - primary_color
      - secondary_color
      - tertiary_color
    TargetUsersJobStatusResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TargetUsersJobStatusTypes'
          description: The status of the job processing the target users.
        total_users:
          $ref: '#/components/schemas/UInt32Type'
          description: The total number of users in the provided list.
        processed_users:
          $ref: '#/components/schemas/UInt32Type'
          description: The number of users processed so far.
        created_at:
          type:
          - string
          - 'null'
          description: The timestamp when the job was created.
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          description: The timestamp when the job was successfully completed.
          format: date-time
        error_message:
          type:
          - string
          - 'null'
          description: The error message if the job failed.
      required:
      - status
      - total_users
      - processed_users
      - created_at
      - completed_at
      - error_message
    Error:
      type: object
      description: A single error, either for an API response or a specific field.
      properties:
        code:
          type: integer
          description: Discord internal error code. See error code reference
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
    RecurrenceRuleResponse:
      type: object
      properties:
        start:
          type: string
          description: Starting time of the recurrence interval
          format: date-time
        end:
          type:
          - string
          - 'null'
          description: Ending time of the recurrence interval
          format: date-time
        frequency:
          $ref: '#/components/schemas/RecurrenceRuleFrequencies'
          description: How often the event occurs
        interval:
          type: integer
          description: The spacing between events, defined by frequency
          format: int32
        by_weekday:
          type:
          - array
          - 'null'
          description: Set of specific days within a week for the event to recur on
          items:
            $ref: '#/components/schemas/RecurrenceRuleWeekdays'
          uniqueItems: true
        by_n_weekday:
          type:
          - array
          - 'null'
          description: List of specific days within a specific week to recur on
          items:
            $ref: '#/components/schemas/ByNWeekdayResponse'
        by_month:
          type:
          - array
          - 'null'
          description: Set of specific months to recur on
          items:
            $ref: '#/components/schemas/RecurrenceRuleMonths'
          uniqueItems: true
        by_month_day:
          type:
          - array
          - 'null'
          description: Set of specific dates within a month to recur on
          items:
            type: integer
            format: int32
          uniqueItems: true
        by_year_day:
          type:
          - array
          - 'null'
          description: Set of days within a year to recur on (1-364)
          items:
            type: integer
            format: int32
          uniqueItems: true
        count:
          type:
          - integer
          - 'null'
          description: Total number of times the event is allowed to recur
          format: int32
      required:
      - start
      - frequency
      - interval
      - by_weekday
      - by_n_weekday
      - by_month
      - by_month_day
    GuildScheduledEventUserResponses:
      type: integer
      oneOf:
      - title: UNINTERESTED
        description: User is not interested in the event
        const: 0
      - title: INTERESTED
        description: User is interested in the event
        const: 1
      format: int32
    UserPrimaryGuildResponse:
      type: object
      properties:
        identity_guild_id:
          description: the id of the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        identity_enabled:
          type:
          - boolean
          - 'null'
          description: whether the user is displaying the primary guild's server tag
        tag:
          type:
          - string
          - 'null'
          description: the text of the user's server tag, limited to 4 characters
        badge:
          type:
          - string
          - 'null'
          description: the server tag badge hash
      required:
      - identity_guild_id
      - identity_enabled
      - tag
      - badge
    UserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
          description: the user's id
        username:
          type: string
          description: the user's username, not unique across the platform
        avatar:
          type:
          - string
          - 'null'
          description: the user's avatar hash
        discriminator:
          type: string
          description: the user's Discord-tag
        public_flags:
          type: integer
          description: the public flags on a user's account
          format: int32
        flags:
          $ref: '#/components/schemas/Int53Type'
          description: the flags on a user's account
        bot:
          type: boolean
          description: whether the user belongs to an OAuth2 application
        system:
          type: boolean
          description: whether the user is an Official Discord System user (part of the urgent message system)
        banner:
          type:
          - string
          - 'null'
          description: the user's banner hash
        accent_color:
          type:
          - integer
          - 'null'
          description: the user's banner color encoded as an integer representation of hexadecimal color code
          format: int32
        global_name:
          type:
          - string
          - 'null'
          description: the user's display name, if it is set
        avatar_decoration_data:
          description: data for the user's avatar decoration
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserAvatarDecorationResponse'
        collectibles:
          description: data for the user's collectibles
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserCollectiblesResponse'
        primary_guild:
          description: the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPrimaryGuildResponse'
      required:
      - id
      - username
      - avatar
      - discriminator
      - public_flags
      - flags
      - global_name
      - primary_guild
    UInt32Type:
      type: integer
      minimum: 0
      maximum: 4294967295
      format: int64
    UserAvatarDecorationResponse:
      type: object
      properties:
        asset:
          type: string
          description: the avatar decoration hash
        sku_id:
          description: id of the avatar decoration's SKU
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
      required:
      - asset
      - sku_id
    ScheduledEventResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
          description: ID of the scheduled event
        guild_id:
          $ref: '#/components/schemas/SnowflakeType'
          description: ID of the guild the scheduled event belongs to
        name:
          type: string
          description: Name of the scheduled event
        description:
          type:
          - string
          - 'null'
          description: Description of the scheduled event
        channel_id:
          description: Channel ID in which the scheduled event will be hosted, or null if entity type is EXTERNAL
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        creator_id:
          description: ID of the user that created the scheduled event
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        creator:
          $ref: '#/components/schemas/UserResponse'
          description: User that created the scheduled event
        image:
          type:
          - string
          - 'null'
          description: Cover image hash of the scheduled event
        scheduled_start_time:
          type: string
          description: When the scheduled event will start
          format: date-time
        scheduled_end_time:
          type:
          - string
          - 'null'
          description: When the scheduled event will end, or null if no end time
          format: date-time
        status:
          $ref: '#/components/schemas/GuildScheduledEventStatuses'
          description: Status of the scheduled event
        entity_type:
          $ref: '#/components/schemas/GuildScheduledEventEntityTypes'
          description: Type of hosting entity associated with the scheduled event
        entity_id:
