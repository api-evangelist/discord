openapi: 3.2.0
info:
  title: Discord Oauth2 API
  version: '10'
  termsOfService: https://discord.com/developers/docs/policies-and-agreements/developer-terms-of-service
  description: 'Operations tagged Oauth2 across 2 of this provider''s published API definitions: discord-openapi.json, discord-oauth2-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://discord.com/api/v10
tags:
- name: OAuth2
paths:
  /oauth2/@me:
    get:
      operationId: get_my_oauth2_authorization
      responses:
        '200':
          description: 200 response for get_my_oauth2_authorization
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2GetAuthorizationResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2:
        - activities.invites.write
        - activities.read
        - activities.write
        - applications.builds.read
        - applications.builds.upload
        - applications.commands
        - applications.commands.permissions.update
        - applications.commands.update
        - applications.entitlements
        - applications.store.update
        - bot
        - connections
        - dm_channels.read
        - email
        - gdm.join
        - guilds
        - guilds.join
        - guilds.members.read
        - identify
        - messages.read
        - openid
        - relationships.read
        - role_connections.write
        - rpc
        - rpc.activities.write
        - rpc.notifications.read
        - rpc.screenshare.read
        - rpc.screenshare.write
        - rpc.video.read
        - rpc.video.write
        - rpc.voice.read
        - rpc.voice.write
        - voice
        - webhook.incoming
      tags:
      - OAuth2
      summary: Get my oauth2 authorization
      x-summary-source: derived
    servers:
    - url: https://discord.com/api/v10
  /oauth2/applications/@me:
    get:
      operationId: get_my_oauth2_application
      responses:
        '200':
          description: 200 response for get_my_oauth2_application
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateApplicationResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - OAuth2
      summary: Get my oauth2 application
      x-summary-source: derived
    servers:
    - url: https://discord.com/api/v10
  /oauth2/keys:
    get:
      operationId: get_public_keys
      responses:
        '200':
          description: 200 response for get_public_keys
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2GetKeys'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - {}
      - BotToken: []
      tags:
      - OAuth2
      summary: Get public keys
      x-summary-source: derived
    servers:
    - url: https://discord.com/api/v10
  /oauth2/userinfo:
    get:
      operationId: get_openid_connect_userinfo
      responses:
        '200':
          description: 200 response for get_openid_connect_userinfo
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2GetOpenIDConnectUserInfoResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2:
        - openid
      tags:
      - OAuth2
      summary: Get openid connect userinfo
      x-summary-source: derived
    servers:
    - url: https://discord.com/api/v10
  /oauth2/authorize:
    servers:
    - url: https://discord.com/api/v10
      description: Discord API v10
    get:
      operationId: authorize
      summary: Discord Authorize
      description: Redirect the user to this URL to begin the OAuth2 authorization flow. This is a browser-based endpoint, not a REST API call.
      tags:
      - OAuth2
      security: []
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - code
          - token
        description: OAuth2 grant type (code or token)
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: Your application's client ID
      - name: scope
        in: query
        required: true
        schema:
          type: string
        description: Space-delimited list of OAuth2 scopes
      - name: state
        in: query
        schema:
          type: string
        description: Unique string for CSRF protection
      - name: redirect_uri
        in: query
        schema:
          type: string
          format: uri
        description: Registered redirect URI
      - name: prompt
        in: query
        schema:
          type: string
          enum:
          - consent
          - none
        description: Controls the authorization prompt behavior
      responses:
        '302':
          description: Redirect to Discord authorization page
  /oauth2/token:
    servers:
    - url: https://discord.com/api/v10
      description: Discord API v10
    post:
      operationId: getToken
      summary: Discord Get access token
      description: Exchange an authorization code for an access token.
      tags:
      - OAuth2
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - code
              - redirect_uri
              properties:
                grant_type:
                  type: string
                  enum:
                  - authorization_code
                  - refresh_token
                  - client_credentials
                code:
                  type: string
                  description: Authorization code received from the authorize redirect
                redirect_uri:
                  type: string
                  format: uri
                  description: Same redirect_uri used in the authorize request
                client_id:
                  type: string
                  description: Application client ID
                client_secret:
                  type: string
                  description: Application client secret
                refresh_token:
                  type: string
                  description: Refresh token (for refresh_token grant)
                scope:
                  type: string
                  description: Space-delimited scopes (for client_credentials grant)
      responses:
        '200':
          description: Access token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        4XX:
          $ref: '#/components/responses/ClientError'
  /oauth2/token/revoke:
    servers:
    - url: https://discord.com/api/v10
      description: Discord API v10
    post:
      operationId: revokeToken
      summary: Discord Revoke access token
      description: Revoke an access token or refresh token.
      tags:
      - OAuth2
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: The access or refresh token to revoke
                token_type_hint:
                  type: string
                  enum:
                  - access_token
                  - refresh_token
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: Token revoked
        4XX:
          $ref: '#/components/responses/ClientError'
components:
  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: The maximum number of requests that can be made in the current ratelimit window
    X-RateLimit-Bucket:
      schema:
        type: string
      description: The bucket that the request belongs to
    X-RateLimit-Reset:
      schema:
        type: number
      description: A unix timestamp in seconds at which the current ratelimit window resets
    X-RateLimit-Reset-After:
      schema:
        type: number
      description: The duration in seconds until the current ratelimit window resets
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: The number of requests remaining in the current ratelimit window
  responses:
    ClientErrorResponse:
      description: Client error response
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-RateLimit-Reset-After:
          $ref: '#/components/headers/X-RateLimit-Reset-After'
        X-RateLimit-Bucket:
          $ref: '#/components/headers/X-RateLimit-Bucket'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientRatelimitedResponse:
      description: Client ratelimited response
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-RateLimit-Reset-After:
          $ref: '#/components/headers/X-RateLimit-Reset-After'
        X-RateLimit-Bucket:
          $ref: '#/components/headers/X-RateLimit-Bucket'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RatelimitedResponse'
    ClientError:
      description: Client error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              error_description:
                type: string
  schemas:
    OAuth2GetKeys:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/OAuth2Key'
      required:
      - keys
    Error:
      type: object
      description: A single error, either for an API response or a specific field.
      properties:
        code:
          type: integer
          description: Discord internal error code. See error code reference
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
    UserPrimaryGuildResponse:
      type: object
      properties:
        identity_guild_id:
          description: the id of the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        identity_enabled:
          type:
          - boolean
          - 'null'
          description: whether the user is displaying the primary guild's server tag
        tag:
          type:
          - string
          - 'null'
          description: the text of the user's server tag, limited to 4 characters
        badge:
          type:
          - string
          - 'null'
          description: the server tag badge hash
      required:
      - identity_guild_id
      - identity_enabled
      - tag
      - badge
    UserAvatarDecorationResponse:
      type: object
      properties:
        asset:
          type: string
          description: the avatar decoration hash
        sku_id:
          description: id of the avatar decoration's SKU
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
      required:
      - asset
      - sku_id
    UserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
          description: the user's id
        username:
          type: string
          description: the user's username, not unique across the platform
        avatar:
          type:
          - string
          - 'null'
          description: the user's avatar hash
        discriminator:
          type: string
          description: the user's Discord-tag
        public_flags:
          type: integer
          description: the public flags on a user's account
          format: int32
        flags:
          $ref: '#/components/schemas/Int53Type'
          description: the flags on a user's account
        bot:
          type: boolean
          description: whether the user belongs to an OAuth2 application
        system:
          type: boolean
          description: whether the user is an Official Discord System user (part of the urgent message system)
        banner:
          type:
          - string
          - 'null'
          description: the user's banner hash
        accent_color:
          type:
          - integer
          - 'null'
          description: the user's banner color encoded as an integer representation of hexadecimal color code
          format: int32
        global_name:
          type:
          - string
          - 'null'
          description: the user's display name, if it is set
        avatar_decoration_data:
          description: data for the user's avatar decoration
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserAvatarDecorationResponse'
        collectibles:
          description: data for the user's collectibles
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserCollectiblesResponse'
        primary_guild:
          description: the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPrimaryGuildResponse'
      required:
      - id
      - username
      - avatar
      - discriminator
      - public_flags
      - flags
      - global_name
      - primary_guild
    ApplicationIntegrationTypeConfigurationResponse:
      type: object
      properties:
        oauth2_install_params:
          $ref: '#/components/schemas/ApplicationOAuth2InstallParamsResponse'
    OAuth2Scopes:
      type: string
      oneOf:
      - title: IDENTIFY
        description: allows /users/@me without email
        const: identify
      - title: EMAIL
        description: enables /users/@me to return an email
        const: email
      - title: CONNECTIONS
        description: allows /users/@me/connections to return linked third-party accounts
        const: connections
      - title: GUILDS
        description: allows /users/@me/guilds to return basic information about all of a user's guilds
        const: guilds
      - title: GUILDS_JOIN
        description: allows /guilds/{guild.id}/members/{user.id} to be used for joining users to a guild
        const: guilds.join
      - title: GUILDS_MEMBERS_READ
        description: allows /users/@me/guilds/{guild.id}/member to return a user's member information in a guild
        const: guilds.members.read
      - title: GDM_JOIN
        description: allows your app to join users to a group dm
        const: gdm.join
      - title: BOT
        description: for oauth2 bots, this puts the bot in the user's selected guild by default
        const: bot
      - title: RPC
        description: for local rpc server access, this allows you to control a user's local Discord client - requires Discord approval
        const: rpc
      - title: RPC_NOTIFICATIONS_READ
        description: for local rpc server access, this allows you to receive notifications pushed out to the user - requires Discord approval
        const: rpc.notifications.read
      - title: RPC_VOICE_READ
        description: for local rpc server access, this allows you to read a user's voice settings and listen for voice events - requires Discord approval
        const: rpc.voice.read
      - title: RPC_VOICE_WRITE
        description: for local rpc server access, this allows you to update a user's voice settings - requires Discord approval
        const: rpc.voice.write
      - title: RPC_VIDEO_READ
        description: for local rpc server access, this allows you to read a user's video status - requires Discord approval
        const: rpc.video.read
      - title: RPC_VIDEO_WRITE
        description: for local rpc server access, this allows you to update a user's video settings - requires Discord approval
        const: rpc.video.write
      - title: RPC_SCREENSHARE_READ
        description: for local rpc server access, this allows you to read a user's screenshare status- requires Discord approval
        const: rpc.screenshare.read
      - title: RPC_SCREENSHARE_WRITE
        description: for local rpc server access, this allows you to update a user's screenshare settings- requires Discord approval
        const: rpc.screenshare.write
      - title: RPC_ACTIVITIES_WRITE
        description: for local rpc server access, this allows you to update a user's activity - requires Discord approval
        const: rpc.activities.write
      - title: WEBHOOK_INCOMING
        description: this generates a webhook that is returned in the oauth token response for authorization code grants
        const: webhook.incoming
      - title: MESSAGES_READ
        description: for local rpc server api access, this allows you to read messages from all client channels (otherwise restricted to channels/guilds your app creates)
        const: messages.read
      - title: APPLICATIONS_BUILDS_UPLOAD
        description: allows your app to upload/update builds for a user's applications - requires Discord approval
        const: applications.builds.upload
      - title: APPLICATIONS_BUILDS_READ
        description: allows your app to read build data for a user's applications
        const: applications.builds.read
      - title: APPLICATIONS_COMMANDS
        description: allows your app to use commands in a guild
        const: applications.commands
      - title: APPLICATIONS_COMMANDS_PERMISSIONS_UPDATE
        description: allows your app to update permissions for its commands in a guild a user has permissions to
        const: applications.commands.permissions.update
      - title: APPLICATIONS_COMMANDS_UPDATE
        description: allows your app to update its commands using a Bearer token - client credentials grant only
        const: applications.commands.update
      - title: APPLICATIONS_STORE_UPDATE
        description: allows your app to read and update store data (SKUs, store listings, achievements, etc.) for a user's applications
        const: applications.store.update
      - title: APPLICATIONS_ENTITLEMENTS
        description: allows your app to read entitlements for a user's applications
        const: applications.entitlements
      - title: ACTIVITIES_READ
        description: allows your app to fetch data from a user's "Now Playing/Recently Played" list - requires Discord approval
        const: activities.read
      - title: ACTIVITIES_WRITE
        description: allows your app to update a user's activity - requires Discord approval (NOT REQUIRED FOR GAMESDK ACTIVITY MANAGER)
        const: activities.write
      - title: ACTIVITIES_INVITES_WRITE
        description: allows your app to send activity invites - requires Discord approval (NOT REQUIRED FOR GAMESDK ACTIVITY MANAGER)
        const: activities.invites.write
      - title: RELATIONSHIPS_READ
        description: allows your app to know a user's friends and implicit relationships - requires Discord approval
        const: relationships.read
      - title: VOICE
        description: allows your app to connect to voice on user's behalf and see all the voice members - requires Discord approval
        const: voice
      - title: DM_CHANNELS_READ
        description: allows your app to see information about the user's DMs and group DMs - requires Discord approval
        const: dm_channels.read
      - title: ROLE_CONNECTIONS_WRITE
        description: allows your app to update a user's connection and metadata for the app
        const: role_connections.write
      - title: OPENID
        description: for OpenID Connect, this allows your app to receive user id and basic profile information
        const: openid
    OAuth2GetAuthorizationResponse:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/ApplicationResponse'
        expires:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuth2Scopes'
          uniqueItems: true
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
      - application
      - expires
      - scopes
    PrivateApplicationResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
        name:
          type: string
        icon:
          type:
          - string
          - 'null'
        description:
          type: string
        type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ApplicationTypes'
        cover_image:
          type: string
        primary_sku_id:
          $ref: '#/components/schemas/SnowflakeType'
        flags:
          type: integer
          format: int32
        flags_new:
          type: string
        bot:
          $ref: '#/components/schemas/UserResponse'
        slug:
          type: string
        conjure_project_id:
          $ref: '#/components/schemas/SnowflakeType'
        vibegrations_project_id:
          $ref: '#/components/schemas/SnowflakeType'
        guild_id:
          $ref: '#/components/schemas/SnowflakeType'
        rpc_origins:
          type: array
          items:
            type: string
        bot_public:
          type: boolean
        bot_require_code_grant:
          type: boolean
        terms_of_service_url:
          type: string
          format: uri
        privacy_policy_url:
          type: string
          format: uri
        custom_install_url:
          type: string
          format: uri
        install_params:
          $ref: '#/components/schemas/ApplicationOAuth2InstallParamsResponse'
        integration_types_config:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ApplicationIntegrationTypeConfigurationResponse'
        verify_key:
          type: string
        max_participants:
          type:
          - integer
          - 'null'
          format: int32
        tags:
          type: array
          items:
            type: string
          uniqueItems: true
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        interactions_endpoint_url:
          type:
          - string
          - 'null'
          format: uri
        role_connections_verification_url:
          type:
          - string
          - 'null'
          format: uri
        owner:
          $ref: '#/components/schemas/UserResponse'
        approximate_guild_count:
          type: integer
          format: int32
        approximate_user_install_count:
          type: integer
          format: int32
        approximate_user_authorization_count:
          type: integer
          format: int32
        event_webhooks_url:
          type:
          - string
          - 'null'
          format: uri
        event_webhooks_status:
          $ref: '#/components/schemas/ApplicationEventWebhooksStatus'
        event_webhooks_types:
          type: array
          items:
            type: string
            enum:
            - APPLICATION_AUTHORIZED
            - APPLICATION_DEAUTHORIZED
            - ENTITLEMENT_CREATE
            - ENTITLEMENT_DELETE
            - ENTITLEMENT_UPDATE
            - GAME_DIRECT_MESSAGE_CREATE
            - GAME_DIRECT_MESSAGE_DELETE
            - GAME_DIRECT_MESSAGE_UPDATE
            - LOBBY_MESSAGE_CREATE
            - LOBBY_MESSAGE_DELETE
            - LOBBY_MESSAGE_UPDATE
            - QUEST_USER_ENROLLMENT
            allOf:
            - $ref: '#/components/schemas/ActionTypes'
          uniqueItems: true
        explicit_content_filter:
          $ref: '#/components/schemas/ApplicationExplicitContentFilterTypes'
        team:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TeamResponse'
        eligible_oauth2_scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuth2Scopes'
      required:
      - id
      - name
      - icon
      - description
      - type
      - flags
      - flags_new
      - verify_key
      - redirect_uris
      - interactions_endpoint_url
      - role_connections_verification_url
      - owner
      - approximate_guild_count
      - approximate_user_install_count
      - approximate_user_authorization_count
      - explicit_content_filter
      - team
      - eligible_oauth2_scopes
    UserCollectiblesResponse:
      type: object
      properties:
        nameplate:
          description: Object mapping of nameplate data
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserNameplateResponse'
      required:
      - nameplate
    ApplicationTypes:
      type: integer
      oneOf:
      - title: GUILD_ROLE_SUBSCRIPTIONS
        const: 4
      format: int32
    OAuth2Key:
      type: object
      properties:
        kty:
          type: string
        use:
          type: string
        kid:
          type: string
        n:
          type: string
        e:
          type: string
        alg:
          type: string
      required:
