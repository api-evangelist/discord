          maxItems: 12
          uniqueItems: true
        by_month_day:
          type:
          - array
          - 'null'
          description: Set of specific dates within a month to recur on
          items:
            type: integer
            minimum: -1
            maximum: 31
            format: int32
          maxItems: 33
          uniqueItems: true
        by_year_day:
          type:
          - array
          - 'null'
          description: Set of days within a year to recur on (1-364)
