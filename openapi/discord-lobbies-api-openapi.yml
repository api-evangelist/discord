openapi: 3.2.0
info:
  title: Discord HTTP API (Preview) Lobbies API
  description: Preview of the Discord v10 HTTP API specification. See https://discord.com/developers/docs for more details.
  termsOfService: https://discord.com/developers/docs/policies-and-agreements/developer-terms-of-service
  license:
    name: MIT
    identifier: MIT
  version: '10'
servers:
- url: https://discord.com/api/v10
tags:
- name: Lobbies
paths:
  /lobbies:
    put:
      operationId: create_or_join_lobby
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idle_timeout_seconds:
                  type:
                  - integer
                  - 'null'
                  minimum: 5
                  maximum: 604800
                  format: int32
                lobby_metadata:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: string
                    maxLength: 1024
                  maxProperties: 25
                member_metadata:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: string
                    maxLength: 1024
                  maxProperties: 25
                secret:
                  type: string
                  maxLength: 250
                flags:
                  oneOf:
                  - type: 'null'
                  - type: integer
                    enum:
                    - 1
              required:
              - secret
        required: true
      responses:
        '200':
          description: 200 response for create_or_join_lobby
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2: []
      tags:
      - Lobbies
      summary: Create or join lobby
      x-summary-source: derived
    post:
      operationId: create_lobby
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idle_timeout_seconds:
                  type:
                  - integer
                  - 'null'
                  minimum: 5
                  maximum: 604800
                  format: int32
                members:
                  type:
                  - array
                  - 'null'
                  items:
                    $ref: '#/components/schemas/LobbyMemberRequest'
                  maxItems: 25
                metadata:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: string
                    maxLength: 1024
                  maxProperties: 25
                flags:
                  oneOf:
                  - type: 'null'
                  - type: integer
                    enum:
                    - 1
                override_event_webhooks_url:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
                  format: uri
        required: true
      responses:
        '201':
          description: 201 response for create_lobby
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Create lobby
      x-summary-source: derived
  /lobbies/{lobby_id}:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_lobby
      responses:
        '200':
          description: 200 response for get_lobby
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Get lobby
      x-summary-source: derived
    delete:
      description: Deletes the specified lobby if it exists. It is safe to call even if the lobby is already deleted.
      operationId: delete_lobby
      responses:
        '204':
          description: 204 response for delete_lobby
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Delete lobby
      x-summary-source: derived
    patch:
      operationId: edit_lobby
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idle_timeout_seconds:
                  type:
                  - integer
                  - 'null'
                  minimum: 5
                  maximum: 604800
                  format: int32
                metadata:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: string
                    maxLength: 1024
                  maxProperties: 25
                members:
                  type:
                  - array
                  - 'null'
                  items:
                    $ref: '#/components/schemas/LobbyMemberRequest'
                  maxItems: 25
                flags:
                  oneOf:
                  - type: 'null'
                  - type: integer
                    enum:
                    - 1
                override_event_webhooks_url:
                  type:
                  - string
                  - 'null'
                  maxLength: 512
                  format: uri
        required: true
      responses:
        '200':
          description: 200 response for edit_lobby
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Edit lobby
      x-summary-source: derived
  /lobbies/{lobby_id}/channel-linking:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    patch:
      operationId: edit_lobby_channel_link
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_id:
                  oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/SnowflakeType'
        required: true
      responses:
        '200':
          description: 200 response for edit_lobby_channel_link
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2: []
      tags:
      - Lobbies
      summary: Edit lobby channel link
      x-summary-source: derived
  /lobbies/{lobby_id}/members/@me:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    delete:
      operationId: leave_lobby
      responses:
        '204':
          description: 204 response for leave_lobby
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2: []
      tags:
      - Lobbies
      summary: Leave lobby
      x-summary-source: derived
  /lobbies/{lobby_id}/members/@me/invites:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: create_linked_lobby_guild_invite_for_self
      responses:
        '200':
          description: 200 response for create_linked_lobby_guild_invite_for_self
          headers:
