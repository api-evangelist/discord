            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyGuildInviteResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2: []
      tags:
      - Lobbies
      summary: Create linked lobby guild invite for self
      x-summary-source: derived
  /lobbies/{lobby_id}/members/bulk:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: bulk_update_lobby_members
      requestBody:
        content:
          application/json:
            schema:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/BulkLobbyMemberRequest'
              minItems: 1
              maxItems: 25
        required: true
      responses:
        '200':
          description: 200 response for bulk_update_lobby_members
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/LobbyMemberResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Bulk update lobby members
      x-summary-source: derived
  /lobbies/{lobby_id}/members/{user_id}:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    put:
      operationId: add_lobby_member
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: string
                    maxLength: 1024
                  maxProperties: 25
                flags:
                  oneOf:
                  - type: 'null'
                  - type: integer
                    enum:
                    - 1
                additional_name:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 80
        required: true
      responses:
        '200':
          description: 200 response for add_lobby_member
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyMemberResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Add lobby member
      x-summary-source: derived
    delete:
      operationId: delete_lobby_member
      responses:
        '204':
          description: 204 response for delete_lobby_member
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Delete lobby member
      x-summary-source: derived
  /lobbies/{lobby_id}/members/{user_id}/invites:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    post:
      operationId: create_linked_lobby_guild_invite_for_user
      responses:
        '200':
          description: 200 response for create_linked_lobby_guild_invite_for_user
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyGuildInviteResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Create linked lobby guild invite for user
      x-summary-source: derived
  /lobbies/{lobby_id}/messages:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_lobby_messages
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: 200 response for get_lobby_messages
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/LobbyMessageResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2: []
      tags:
      - Lobbies
      summary: Get lobby messages
      x-summary-source: derived
    post:
      operationId: create_lobby_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SDKMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SDKMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SDKMessageRequest'
        required: true
      responses:
        '201':
          description: 201 response for create_lobby_message
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyMessageResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2: []
      tags:
      - Lobbies
      summary: Create lobby message
      x-summary-source: derived
  /lobbies/{lobby_id}/messages/{message_id}/moderation-metadata:
    parameters:
    - name: lobby_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: message_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    put:
      description: Update the external moderation metadata for a lobby message.
      operationId: update_lobby_message_external_moderation_metadata
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The moderation metadata attached to the message
              additionalProperties:
                type: string
                maxLength: 2000
              maxProperties: 5
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: The moderation metadata attached to the message
              additionalProperties:
                type: string
                maxLength: 2000
              maxProperties: 5
          multipart/form-data:
            schema:
              type: object
              description: The moderation metadata attached to the message
              additionalProperties:
                type: string
                maxLength: 2000
              maxProperties: 5
        required: true
      responses:
        '204':
          description: 204 response for update_lobby_message_external_moderation_metadata
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Lobbies
      summary: Update lobby message external moderation metadata
      x-summary-source: derived
components:
  schemas:
    LobbyMemberResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        flags:
          type: integer
          format: int32
        additional_name:
          type: string
      required:
      - id
      - metadata
      - flags
    BulkLobbyMemberRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            maxLength: 1024
          maxProperties: 25
        flags:
          oneOf:
          - type: 'null'
          - type: integer
            enum:
            - 1
        additional_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 80
        remove_member:
          type:
          - boolean
          - 'null'
      required:
      - id
    RoleSelectComponentForMessageRequest:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 6
          allOf:
          - $ref: '#/components/schemas/MessageComponentTypes'
          format: int32
        id:
          type:
          - integer
          - 'null'
          minimum: 0
          format: int32
        custom_id:
          type: string
          minLength: 1
          maxLength: 100
        placeholder:
          type:
          - string
          - 'null'
          maxLength: 150
        min_values:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 25
        max_values:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 25
        disabled:
          type:
          - boolean
          - 'null'
        required:
          type:
          - boolean
          - 'null'
        default_values:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RoleSelectDefaultValue'
          maxItems: 25
      required:
      - type
      - custom_id
    MentionableSelectComponentForMessageRequest:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 7
          allOf:
          - $ref: '#/components/schemas/MessageComponentTypes'
          format: int32
        id:
          type:
          - integer
          - 'null'
          minimum: 0
          format: int32
        custom_id:
          type: string
          minLength: 1
          maxLength: 100
        placeholder:
          type:
          - string
          - 'null'
          maxLength: 150
        min_values:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 25
