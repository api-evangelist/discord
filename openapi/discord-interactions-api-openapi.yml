openapi: 3.2.0
info:
  title: Discord HTTP API (Preview) Interactions API
  description: Preview of the Discord v10 HTTP API specification. See https://discord.com/developers/docs for more details.
  termsOfService: https://discord.com/developers/docs/policies-and-agreements/developer-terms-of-service
  license:
    name: MIT
    identifier: MIT
  version: '10'
servers:
- url: https://discord.com/api/v10
tags:
- name: Interactions
paths:
  /interactions/{interaction_id}/{interaction_token}/callback:
    parameters:
    - name: interaction_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    - name: interaction_token
      in: path
      schema:
        type: string
        maxLength: 152133
      required: true
    post:
      operationId: create_interaction_response
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApplicationCommandAutocompleteCallbackRequest'
              - $ref: '#/components/schemas/CreateMessageInteractionCallbackRequest'
              - $ref: '#/components/schemas/ModalInteractionCallbackRequest'
              - $ref: '#/components/schemas/PongInteractionCallbackRequest'
              - $ref: '#/components/schemas/UpdateMessageInteractionCallbackRequest'
              x-discord-union: oneOf
          application/x-www-form-urlencoded:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApplicationCommandAutocompleteCallbackRequest'
              - $ref: '#/components/schemas/CreateMessageInteractionCallbackRequest'
              - $ref: '#/components/schemas/ModalInteractionCallbackRequest'
              - $ref: '#/components/schemas/PongInteractionCallbackRequest'
              - $ref: '#/components/schemas/UpdateMessageInteractionCallbackRequest'
              x-discord-union: oneOf
          multipart/form-data:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApplicationCommandAutocompleteCallbackRequest'
              - $ref: '#/components/schemas/CreateMessageInteractionCallbackRequest'
              - $ref: '#/components/schemas/ModalInteractionCallbackRequest'
              - $ref: '#/components/schemas/PongInteractionCallbackRequest'
              - $ref: '#/components/schemas/UpdateMessageInteractionCallbackRequest'
              x-discord-union: oneOf
        required: true
      responses:
        '204':
          description: 204 response for create_interaction_response
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - {}
      - BotToken: []
      tags:
      - Interactions
      summary: Create interaction response
      x-summary-source: derived
components:
  schemas:
    ButtonStyleTypes:
      type: integer
      oneOf:
      - title: PRIMARY
        const: 1
      - title: SECONDARY
        const: 2
      - title: SUCCESS
        const: 3
      - title: DANGER
        const: 4
      - title: LINK
        const: 5
      - title: PREMIUM
        const: 6
      format: int32
    IncomingWebhookInteractionRequest:
      type: object
      properties:
        content:
          type:
          - string
          - 'null'
          maxLength: 2000
        embeds:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RichEmbed'
          maxItems: 10
        allowed_mentions:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/MessageAllowedMentionsRequest'
        components:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ActionRow'
          maxItems: 5
        attachments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MessageAttachmentRequest'
          maxItems: 10
        tts:
          type:
          - boolean
          - 'null'
        flags:
          type:
          - integer
          - 'null'
    Emoji:
      type: object
      properties:
        id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        name:
          type: string
          maxLength: 32
        animated:
          type:
          - boolean
          - 'null'
      required:
      - name
    Button:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 2
          allOf:
          - $ref: '#/components/schemas/MessageComponentTypes'
          format: int32
        custom_id:
          type:
          - string
          - 'null'
          maxLength: 100
        style:
          $ref: '#/components/schemas/ButtonStyleTypes'
        label:
          type:
          - string
          - 'null'
          maxLength: 80
        disabled:
          type:
          - boolean
          - 'null'
        emoji:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Emoji'
        url:
          type:
          - string
          - 'null'
          maxLength: 512
          format: uri
        sku_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
      required:
      - type
      - style
    SnowflakeType:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      format: snowflake
    RichEmbedField:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        value:
          type: string
          maxLength: 1024
        inline:
          type:
          - boolean
          - 'null'
      required:
      - name
      - value
    InteractionApplicationCommandAutocompleteCallbackStringData:
      type: object
      properties:
        choices:
          type:
          - array
          - 'null'
          items:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ApplicationCommandOptionStringChoice'
          maxItems: 25
    MessageComponentTypes:
      type: integer
      oneOf:
      - title: ACTION_ROW
        description: Container for other components
        const: 1
      - title: BUTTON
        description: Button object
        const: 2
      - title: STRING_SELECT
        description: Select menu for picking from defined text options
        const: 3
      - title: INPUT_TEXT
        description: Text input object
        const: 4
      - title: USER_SELECT
        description: Select menu for users
        const: 5
      - title: ROLE_SELECT
        description: Select menu for roles
        const: 6
      - title: MENTIONABLE_SELECT
        description: Select menu for mentionables (users and roles)
        const: 7
      - title: CHANNEL_SELECT
        description: Select menu for channels
        const: 8
      format: int32
    MentionableSelect:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 7
          allOf:
          - $ref: '#/components/schemas/MessageComponentTypes'
          format: int32
        custom_id:
          type: string
          maxLength: 100
        placeholder:
          type:
          - string
          - 'null'
          maxLength: 150
        min_values:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 25
        max_values:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 25
        disabled:
          type:
          - boolean
          - 'null'
        default_values:
          type:
          - array
          - 'null'
          items:
            oneOf:
            - $ref: '#/components/schemas/RoleSelectDefaultValue'
            - $ref: '#/components/schemas/UserSelectDefaultValue'
          maxItems: 25
      required:
      - type
      - custom_id
    ChannelSelectDefaultValue:
      type: object
      properties:
        type:
          type: string
          enum:
