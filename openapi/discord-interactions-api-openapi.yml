          - object
          - 'null'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 100
          maxProperties: 34
        value:
          type: string
          maxLength: 6000
      required:
      - name
      - value
    InteractionApplicationCommandAutocompleteCallbackNumberData:
      type: object
      properties:
        choices:
          type:
          - array
          - 'null'
          items:
            oneOf:
            - type: 'null'
