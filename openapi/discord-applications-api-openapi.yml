components:
  schemas:
    ApplicationCommandNumberOptionResponse:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 10
          allOf:
          - $ref: '#/components/schemas/ApplicationCommandOptionType'
          format: int32
        name:
          type: string
        name_localized:
          type: string
        name_localizations:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        description:
          type: string
        description_localized:
          type: string
        description_localizations:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
        required:
          type: boolean
        autocomplete:
          type: boolean
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationCommandOptionNumberChoiceResponse'
        min_value:
          type: number
          format: double
        max_value:
          type: number
          format: double
      required:
      - type
      - name
      - description
    CreateEntitlementRequestData:
      type: object
      properties:
        sku_id:
          $ref: '#/components/schemas/SnowflakeType'
          description: ID of the SKU to grant the entitlement to
        owner_id:
          $ref: '#/components/schemas/SnowflakeType'
          description: ID of the guild or user to grant the entitlement to
        owner_type:
          $ref: '#/components/schemas/EntitlementOwnerTypes'
          description: 1 for a guild subscription, 2 for a user subscription
      required:
      - sku_id
      - owner_id
      - owner_type
    PrivateChannelLocation:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - pc
          allOf:
          - $ref: '#/components/schemas/EmbeddedActivityLocationKind'
        channel_id:
          $ref: '#/components/schemas/SnowflakeType'
      required:
      - id
      - kind
      - channel_id
    ApplicationCommandRoleOption:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 8
          allOf:
          - $ref: '#/components/schemas/ApplicationCommandOptionType'
          format: int32
        name:
          type: string
          minLength: 1
          maxLength: 32
        name_localizations:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 32
          maxProperties: 34
        description:
          type: string
          minLength: 1
          maxLength: 100
        description_localizations:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 100
          maxProperties: 34
        required:
          type:
          - boolean
          - 'null'
      required:
      - type
      - name
      - description
    ApplicationCommandChannelOption:
      type: object
      properties:
        type:
          type: integer
          enum:
          - 7
          allOf:
          - $ref: '#/components/schemas/ApplicationCommandOptionType'
          format: int32
        name:
          type: string
          minLength: 1
          maxLength: 32
        name_localizations:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 32
          maxProperties: 34
        description:
          type: string
          minLength: 1
          maxLength: 100
        description_localizations:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 100
          maxProperties: 34
        required:
          type:
          - boolean
          - 'null'
        channel_types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChannelTypes'
          uniqueItems: true
      required:
      - type
      - name
      - description
    UserPrimaryGuildResponse:
      type: object
      properties:
        identity_guild_id:
          description: the id of the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        identity_enabled:
          type:
          - boolean
          - 'null'
          description: whether the user is displaying the primary guild's server tag
        tag:
          type:
          - string
          - 'null'
          description: the text of the user's server tag, limited to 4 characters
        badge:
          type:
          - string
          - 'null'
          description: the server tag badge hash
      required:
      - identity_guild_id
      - identity_enabled
      - tag
      - badge
    UserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
          description: the user's id
        username:
          type: string
          description: the user's username, not unique across the platform
        avatar:
          type:
          - string
          - 'null'
          description: the user's avatar hash
        discriminator:
          type: string
          description: the user's Discord-tag
        public_flags:
          type: integer
          description: the public flags on a user's account
          format: int32
        flags:
          $ref: '#/components/schemas/Int53Type'
          description: the flags on a user's account
