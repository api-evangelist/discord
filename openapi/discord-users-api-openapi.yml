openapi: 3.2.0
info:
  title: Discord HTTP API (Preview) Users API
  description: Preview of the Discord v10 HTTP API specification. See https://discord.com/developers/docs for more details.
  termsOfService: https://discord.com/developers/docs/policies-and-agreements/developer-terms-of-service
  license:
    name: MIT
    identifier: MIT
  version: '10'
servers:
- url: https://discord.com/api/v10
tags:
- name: Users
paths:
  /users/@me:
    get:
      operationId: get_my_user
      responses:
        '200':
          description: 200 response for get_my_user
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPIIResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2:
        - identify
      tags:
      - Users
      summary: Get my user
      x-summary-source: derived
    patch:
      operationId: update_my_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotAccountPatchRequest'
        required: true
      responses:
        '200':
          description: 200 response for update_my_user
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPIIResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Users
      summary: Update my user
      x-summary-source: derived
  /users/@me/applications/{application_id}/entitlements:
    parameters:
    - name: application_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_current_user_application_entitlements
      parameters:
      - name: sku_ids
        in: query
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/SnowflakeType'
            maxItems: 100
            uniqueItems: true
      - name: exclude_consumed
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: 200 response for get_current_user_application_entitlements
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntitlementResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - OAuth2:
        - activities.invites.write
        - activities.read
        - activities.write
        - applications.builds.read
        - applications.builds.upload
        - applications.commands
        - applications.commands.permissions.update
        - applications.commands.update
        - applications.entitlements
        - applications.store.update
        - bot
        - connections
        - dm_channels.read
        - email
        - gdm.join
        - guilds
        - guilds.join
        - guilds.members.read
        - identify
        - messages.read
        - openid
        - relationships.read
        - role_connections.write
        - rpc
        - rpc.activities.write
        - rpc.notifications.read
        - rpc.screenshare.read
        - rpc.screenshare.write
        - rpc.video.read
        - rpc.video.write
        - rpc.voice.read
        - rpc.voice.write
        - voice
        - webhook.incoming
      tags:
      - Users
      summary: Get current user application entitlements
      x-summary-source: derived
  /users/@me/applications/{application_id}/role-connection:
    parameters:
    - name: application_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_application_user_role_connection
      responses:
        '200':
          description: 200 response for get_application_user_role_connection
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationUserRoleConnectionResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - OAuth2:
        - role_connections.write
      tags:
      - Users
      summary: Get application user role connection
      x-summary-source: derived
    put:
      operationId: update_application_user_role_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationUserRoleConnectionRequest'
        required: true
      responses:
        '200':
          description: 200 response for update_application_user_role_connection
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationUserRoleConnectionResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - OAuth2:
        - role_connections.write
      tags:
      - Users
      summary: Update application user role connection
      x-summary-source: derived
    delete:
      operationId: delete_application_user_role_connection
      responses:
        '204':
          description: 204 response for delete_application_user_role_connection
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - OAuth2:
        - role_connections.write
      tags:
      - Users
      summary: Delete application user role connection
      x-summary-source: derived
  /users/@me/channels:
    post:
      operationId: create_dm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateChannelRequest'
        required: true
      responses:
        '200':
          description: 200 response for create_dm
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PrivateChannelResponse'
                - $ref: '#/components/schemas/PrivateGroupChannelResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Users
      summary: Create dm
      x-summary-source: derived
  /users/@me/connections:
    get:
      operationId: list_my_connections
      responses:
        '200':
          description: 200 response for list_my_connections
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/ConnectedAccountResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2:
        - connections
      tags:
      - Users
      summary: List my connections
      x-summary-source: derived
  /users/@me/guilds:
    get:
      operationId: list_my_guilds
      parameters:
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/SnowflakeType'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: shard
        in: query
        schema:
          type: integer
          minimum: 0
      - name: with_counts
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: 200 response for list_my_guilds
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                type:
                - array
                - 'null'
                items:
                  $ref: '#/components/schemas/MyGuildResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      - OAuth2:
        - guilds
      tags:
      - Users
      summary: List my guilds
      x-summary-source: derived
  /users/@me/guilds/{guild_id}:
    parameters:
    - name: guild_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    delete:
      operationId: leave_guild
      responses:
        '204':
          description: 204 response for leave_guild
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Users
      summary: Leave guild
      x-summary-source: derived
  /users/@me/guilds/{guild_id}/member:
    parameters:
    - name: guild_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_my_guild_member
      responses:
        '200':
          description: 200 response for get_my_guild_member
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateGuildMemberResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - OAuth2:
        - guilds.members.read
      tags:
      - Users
      summary: Get my guild member
      x-summary-source: derived
  /users/{user_id}:
    parameters:
    - name: user_id
      in: path
      schema:
        $ref: '#/components/schemas/SnowflakeType'
      required: true
    get:
      operationId: get_user
      responses:
        '200':
          description: 200 response for get_user
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Reset-After:
              $ref: '#/components/headers/X-RateLimit-Reset-After'
            X-RateLimit-Bucket:
              $ref: '#/components/headers/X-RateLimit-Bucket'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '429':
          $ref: '#/components/responses/ClientRatelimitedResponse'
        4XX:
          $ref: '#/components/responses/ClientErrorResponse'
      security:
      - BotToken: []
      tags:
      - Users
      summary: Get user
      x-summary-source: derived
components:
  headers:
    X-RateLimit-Limit:
      schema:
        type: integer
      description: The maximum number of requests that can be made in the current ratelimit window
    X-RateLimit-Bucket:
      schema:
        type: string
      description: The bucket that the request belongs to
    X-RateLimit-Reset:
      schema:
        type: number
      description: A unix timestamp in seconds at which the current ratelimit window resets
    X-RateLimit-Reset-After:
      schema:
        type: number
      description: The duration in seconds until the current ratelimit window resets
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: The number of requests remaining in the current ratelimit window
  schemas:
    ConnectedAccountResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/ConnectedAccountProviders'
        friend_sync:
          type: boolean
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedAccountIntegrationResponse'
        show_activity:
          type: boolean
        two_way_link:
          type: boolean
        verified:
          type: boolean
        visibility:
          $ref: '#/components/schemas/ConnectedAccountVisibility'
        revoked:
          type: boolean
      required:
      - id
      - name
      - type
      - friend_sync
      - show_activity
      - two_way_link
      - verified
      - visibility
    AvailableLocalesEnum:
      type: string
      oneOf:
      - title: ar
        description: The ar locale
        const: ar
      - title: bg
        description: The bg locale
        const: bg
      - title: cs
        description: The cs locale
        const: cs
      - title: da
        description: The da locale
        const: da
      - title: de
        description: The de locale
        const: de
      - title: el
        description: The el locale
        const: el
      - title: en-GB
        description: The en-GB locale
        const: en-GB
      - title: en-US
        description: The en-US locale
        const: en-US
      - title: es-419
        description: The es-419 locale
        const: es-419
      - title: es-ES
        description: The es-ES locale
        const: es-ES
      - title: fi
        description: The fi locale
        const: fi
      - title: fr
        description: The fr locale
        const: fr
      - title: he
        description: The he locale
        const: he
      - title: hi
        description: The hi locale
        const: hi
      - title: hr
        description: The hr locale
        const: hr
      - title: hu
        description: The hu locale
        const: hu
      - title: id
        description: The id locale
        const: id
      - title: it
        description: The it locale
        const: it
      - title: ja
        description: The ja locale
        const: ja
      - title: ko
        description: The ko locale
        const: ko
      - title: lt
        description: The lt locale
        const: lt
      - title: nl
        description: The nl locale
        const: nl
      - title: 'no'
        description: The no locale
        const: 'no'
      - title: pl
        description: The pl locale
        const: pl
      - title: pt-BR
        description: The pt-BR locale
        const: pt-BR
      - title: ro
        description: The ro locale
        const: ro
      - title: ru
        description: The ru locale
        const: ru
      - title: sv-SE
        description: The sv-SE locale
        const: sv-SE
      - title: th
        description: The th locale
        const: th
      - title: tr
        description: The tr locale
        const: tr
      - title: uk
        description: The uk locale
        const: uk
      - title: vi
        description: The vi locale
        const: vi
      - title: zh-CN
        description: The zh-CN locale
        const: zh-CN
      - title: zh-TW
        description: The zh-TW locale
        const: zh-TW
    Error:
      type: object
      description: A single error, either for an API response or a specific field.
      properties:
        code:
          type: integer
          description: Discord internal error code. See error code reference
        message:
          type: string
          description: Human-readable error message
      required:
      - code
      - message
    UserPrimaryGuildResponse:
      type: object
      properties:
        identity_guild_id:
          description: the id of the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        identity_enabled:
          type:
          - boolean
          - 'null'
          description: whether the user is displaying the primary guild's server tag
        tag:
          type:
          - string
          - 'null'
          description: the text of the user's server tag, limited to 4 characters
        badge:
          type:
          - string
          - 'null'
          description: the server tag badge hash
      required:
      - identity_guild_id
      - identity_enabled
      - tag
      - badge
    UserResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
          description: the user's id
        username:
          type: string
          description: the user's username, not unique across the platform
        avatar:
          type:
          - string
          - 'null'
          description: the user's avatar hash
        discriminator:
          type: string
          description: the user's Discord-tag
        public_flags:
          type: integer
          description: the public flags on a user's account
          format: int32
        flags:
          $ref: '#/components/schemas/Int53Type'
          description: the flags on a user's account
        bot:
          type: boolean
          description: whether the user belongs to an OAuth2 application
        system:
          type: boolean
          description: whether the user is an Official Discord System user (part of the urgent message system)
        banner:
          type:
          - string
          - 'null'
          description: the user's banner hash
        accent_color:
          type:
          - integer
          - 'null'
          description: the user's banner color encoded as an integer representation of hexadecimal color code
          format: int32
        global_name:
          type:
          - string
          - 'null'
          description: the user's display name, if it is set
        avatar_decoration_data:
          description: data for the user's avatar decoration
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserAvatarDecorationResponse'
        collectibles:
          description: data for the user's collectibles
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserCollectiblesResponse'
        primary_guild:
          description: the user's primary guild
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/UserPrimaryGuildResponse'
      required:
      - id
      - username
      - avatar
      - discriminator
      - public_flags
      - flags
      - global_name
      - primary_guild
    UserAvatarDecorationResponse:
      type: object
      properties:
        asset:
          type: string
          description: the avatar decoration hash
        sku_id:
          description: id of the avatar decoration's SKU
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
      required:
      - asset
      - sku_id
    EntitlementResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
        sku_id:
          $ref: '#/components/schemas/SnowflakeType'
        application_id:
          $ref: '#/components/schemas/SnowflakeType'
        user_id:
          $ref: '#/components/schemas/SnowflakeType'
        guild_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        deleted:
          type: boolean
        starts_at:
          type:
          - string
          - 'null'
          format: date-time
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
        type:
          $ref: '#/components/schemas/EntitlementTypes'
        fulfilled_at:
          type:
          - string
          - 'null'
          format: date-time
        fulfillment_status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EntitlementTenantFulfillmentStatusResponse'
        consumed:
          type: boolean
        gifter_user_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
        parent_id:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnowflakeType'
      required:
      - id
      - sku_id
      - application_id
      - user_id
      - deleted
      - starts_at
      - ends_at
      - type
    MyGuildResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SnowflakeType'
        name:
          type: string
        icon:
          type:
          - string
          - 'null'
        banner:
          type:
          - string
          - 'null'
        owner:
          type: boolean
        permissions:
          type: string
        features:
          type: array
          items:
            $ref: '#/components/schemas/GuildFeatures'
          uniqueItems: true
        approximate_member_count:
          type:
          - integer
          - 'null'
