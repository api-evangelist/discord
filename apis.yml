apis:
- aid: discord:discord-gateway-api
  name: Discord Gateway API
  description: >-
    The Discord Gateway API provides persistent, stateful WebSocket connections between your client and
    Discord servers. These connections are used for sending and receiving real-time events your client
    can use to track and update local state, including message creation, guild updates, presence changes,
    and voice state updates.
  humanURL: https://discord.com/developers/docs/events/gateway
  tags:
  - Events
  - Gateway
  - Real-Time
  - WebSocket
  properties:
  - type: Documentation
    url: https://discord.com/developers/docs/events/gateway
  - type: Documentation
    url: https://discord.com/developers/docs/events/gateway-events
  - type: AsyncAPI
    url: asyncapi/discord-gateway-api-asyncapi.yml
  contact:
  - FN: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
- aid: discord:discord-interactions-api
  name: Discord Interactions API
  description: >-
    The Discord Interactions API enables applications to create and respond to application commands (slash
    commands), message components, and modals. It supports both Gateway-based and webhook-based interaction
    handling, allowing bots to build rich, interactive user experiences within Discord.
  humanURL: https://discord.com/developers/docs/interactions/overview
  tags:
  - Components
  - Interactions
  - Modals
  - Slash Commands
  properties:
  - type: Documentation
    url: https://discord.com/developers/docs/interactions/overview
  - type: Documentation
    url: https://discord.com/developers/docs/interactions/application-commands
  - type: Documentation
    url: https://discord.com/developers/docs/interactions/receiving-and-responding
  - type: OpenAPI
    url: openapi/discord-interactions-api-openapi.yml
  contact:
  - FN: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
- aid: discord:discord-oauth2-api
  name: Discord OAuth2 API
  description: >-
    The Discord OAuth2 API enables application developers to build applications that utilize authentication
    and data from the Discord API. Discord supports the authorization code grant, the implicit grant,
    client credentials, and specialized flows for bots and webhooks, allowing third-party applications
    to access Discord user data with proper consent.
  humanURL: https://discord.com/developers/docs/topics/oauth2
  tags:
  - Authentication
  - Authorization
  - OAuth2
  properties:
  - type: Documentation
    url: https://discord.com/developers/docs/topics/oauth2
  - type: OpenAPI
    url: openapi/discord-oauth2-api-openapi.yml
  contact:
  - FN: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
- aid: discord:discord-webhook-events-api
  name: Discord Webhook Events API
  description: >-
    The Discord Webhook Events API provides HTTP-based outgoing webhook events that allow applications
    to receive notifications for specific events without maintaining a persistent connection. Supported
    events include APPLICATION_AUTHORIZED, ENTITLEMENT_CREATE, and QUEST_USER_ENROLLMENT.
  humanURL: https://discord.com/developers/docs/events/webhook-events
  tags:
  - Events
  - Notifications
  - Webhooks
  properties:
  - type: Documentation
    url: https://discord.com/developers/docs/events/webhook-events
  - type: OpenAPI
    url: openapi/discord-webhook-events-api-openapi.yml
  contact:
  - FN: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
- aid: discord:discord-embedded-app-sdk
  name: Discord Embedded App SDK
  description: >-
    The Discord Embedded App SDK lets you build rich, multiplayer experiences as Activities inside Discord.
    It handles RPC calls between your application and Discord, enabling interactive activities like games
    that can run in voice channels, text channels, or DMs.
  humanURL: https://discord.com/developers/docs/developer-tools/embedded-app-sdk
  tags:
  - Activities
  - Embedded
  - Games
  - SDK
  properties:
  - type: Documentation
    url: https://discord.com/developers/docs/developer-tools/embedded-app-sdk
  - type: GitHubRepo
    url: https://github.com/discord/embedded-app-sdk
  contact:
  - FN: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
- aid: discord:discord-voice-api
  name: Discord Voice API
  description: >-
    The Discord Voice API provides the protocol for establishing and managing voice connections between
    clients and Discord voice servers. It handles UDP-based voice data transmission, encryption with XSalsa20-Poly1305,
    and supports features like speaking indicators and voice state updates.
  humanURL: https://discord.com/developers/docs/topics/voice-connections
  tags:
  - Real-Time
  - UDP
  - Voice
  - WebSocket
  properties:
  - type: Documentation
    url: https://discord.com/developers/docs/topics/voice-connections
  - type: AsyncAPI
    url: asyncapi/discord-voice-api-asyncapi.yml
  contact:
  - FN: Discord Support
    url: https://support-dev.discord.com/hc/en-us
    email: support@discord.com
- aid: discord:discord-social-sdk
  name: Discord Social SDK
  description: >-
    The Discord Social SDK allows game developers to add rich social features into their games across
    desktop, mobile, and console platforms. It supports features like account linking, rich presence,
    lobbies, voice chat, direct messaging, friends lists, and game invites to create connected social
    experiences powered by Discord.
  humanURL: https://discord.com/developers/docs/discord-social-sdk/overview
  tags:
  - Gaming
  - Rich Presence
  - SDK
  - Social
  - Voice
