# Vendor facets — Discord. A chat server is a support channel (2 pts) and nothing else on the
# Kin Score. The credit is half when declared as Community (unprobed), and an invite link that
# expires — the default is seven days — grades dead once it is probed.
vendor: discord
name: Discord
website: https://discord.com
areas:
- community
registry_keys:
- discord
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  A Discord server earns a provider exactly one check, support_channel (2 points), and the pointer is
  fragile. Declared as Community it grades half credit because the pointer probe never reads that type.
  Declared as Support it is probed, and discord.gg tells a valid invite from an expired one: 22 of 226
  probed Discord support pointers were already dead. Invites default to seven days; only a Community Server
  can issue one that never expires. Announcement channels are not a changelog and Discord has no blog
  or roadmap to offer.
features:
- id: server-invite
  name: Server invite links
  description: >-
    Links that let anyone join a server; they default to seven days, and a never-expiring link is available
    to Community Servers.
  source: https://support.discord.com/hc/en-us/articles/208866998-Invites-101
  tier: all
- id: community-server
  name: Community Server tools
  description: >-
    Rules channel, onboarding, server insights, announcement channels and, above 1,000 members, Server
    Discovery.
  source: https://support.discord.com/hc/en-us/articles/360047132851-Enabling-Your-Community-Server
  tier: all
- id: announcement-channels
  name: Announcement channels
  description: Channels whose posts other servers can follow, used to broadcast updates.
  source: https://support.discord.com/hc/en-us/articles/360047132851-Enabling-Your-Community-Server
  tier: all
maps:
- feature: server-invite
  check: support_channel
  layer: composite
  credit: 0.5
  provider_must: >-
    Enable Community, issue an invite set to never expire, and declare it in apis.yml common[]. As Community
    it grades "unverified" (0.5) because probe-pointers.py does not probe Community; as Support it is
    probed and earns 1.0 while the invite is valid.
  note: >-
    Probed 2026-09-22: of 226 discord.gg / discord.com pointers typed Support, 204 were live and 22 graded
    soft-404 (discord.gg returns a 200 generic "Discord" page for an invalid invite and the server's own
    title for a valid one, checked 2026-09-25). A default seven-day invite is dead within a week.
  catalog_pass_rate: 0.45
  facet: developer_ergonomics
  points: 2
  baseline_pass_rate: 0.69
earns_nothing:
- feature: announcement-channels
  check: change_log_present
  why: >-
    A chat channel is not a changelog page; a probe of the channel URL sees the Discord app shell, not
    dated release entries.
- feature: community-server
  check: roadmap_present
  why: Discord offers no roadmap or idea-board surface a RoadMap pointer could honestly name.
out_of_reach:
  checks:
  - blog_present
  - documentation_present
  - contract_present
  - status_page_present
  note: A chat server is a route to people; it hosts no documents a pointer check could read.
surface:
  developer_ergonomics:
    reachable: 1.0
    total: 42
  agent_readiness:
    reachable: 0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
